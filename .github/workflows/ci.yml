name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check host/client
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node --check lib/client.dynamic.js
          node --check scripts/build-dynamic.mjs
      - name: Manifest JSON valid
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("package.json","utf8")); JSON.parse(require("fs").readFileSync("dsh.plugin.json","utf8"))'
      - name: Manifest versions agree
        run: |
          node -e 'const a=JSON.parse(require("fs").readFileSync("package.json","utf8")).version,b=JSON.parse(require("fs").readFileSync("dsh.plugin.json","utf8")).version; if(a!==b){console.error(`package.json ${a} !== dsh.plugin.json ${b}`);process.exit(1)}'
      - name: Install script syntax
        run: bash -n install.sh
      - name: Bundle patch declares the plugin row
        run: 'grep -q "id: dsh-convmap" cordis.patch.yml'
      - name: Files listed in package.json exist
        run: |
          node -e 'const fs=require("fs");const missing=(JSON.parse(fs.readFileSync("package.json","utf8")).files||[]).filter(f=>!fs.existsSync(f)); if(missing.length){console.error("missing: "+missing.join(", "));process.exit(1)}'
      - name: Unit tests
        run: node --test test/*.test.mjs
